apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tutoring

resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 03-postgres.yaml
  - 04-server.yaml
  - 05-web.yaml
  - 06-ingress.yaml

# 修改镜像版本：
# kubectl -n tutoring set image deploy/server server=tutoring-server:v1.0.1
# 或 kustomize edit set image tutoring-server=v1.0.1
images:
  - name: tutoring-server
    newTag: latest
  - name: tutoring-web
    newTag: latest
