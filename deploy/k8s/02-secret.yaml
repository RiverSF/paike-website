# 敏感配置：上线前务必修改（也可用 kubectl create secret 生成，避免入库）
# kubectl -n tutoring create secret generic tutoring-secret \
#   --from-literal=POSTGRES_PASSWORD=xxx --from-literal=PG_PASSWORD=xxx \
#   --from-literal=JWT_SECRET=xxx
apiVersion: v1
kind: Secret
metadata:
  name: tutoring-secret
  namespace: tutoring
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres"
  PG_PASSWORD: "postgres"
  JWT_SECRET: "please-change-this-secret"
  # 首次启动初始化站点拥有者（可选）：三件套齐全才会自动创建首个 owner（永久会员）。
  # 不配置则系统处于待初始化状态，需手工执行 server/migrations/002_role.sql 指定 owner。
  # INIT_OWNER_USERNAME: "admin"
  # INIT_OWNER_PHONE: "13800000000"
  # INIT_OWNER_PASSWORD: "强密码至少8位"
