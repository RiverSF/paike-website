apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: tutoring
  labels:
    app: server
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: tutoring
spec:
  # 上传目录当前使用 ReadWriteOnce PVC，因此副本数为 1。
  # 需要扩容时，请先改为 ReadWriteMany 存储或对象存储（OSS/S3），否则多余副本会 Pending。
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      labels:
        app: server
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: server
          image: tutoring-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: tutoring-config
            - secretRef:
                name: tutoring-secret
          volumeMounts:
            - name: uploads
              mountPath: /app/data/uploads
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1000m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /ping, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: 9090 }
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: server-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: server-uploads
  namespace: tutoring
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
